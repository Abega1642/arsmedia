openapi: "3.1.0"
info:
  title: Arsmedia Backend API
  description: >
    Backend API for the **Arsmedia Application**. This API provides endpoints for:
    
    **Video Capabilities**
    - Convert between formats: .avi → .mp4, .mkv → .mov, .webm → .avi, etc.
    - Change codecs (H.264, H.265, VP9, AV1).
    - Extract or replace audio tracks.
    - Cut, trim, merge, or concatenate videos without re-encoding.
    - Resize, crop, rotate, or flip videos.
    - Add subtitles or burn them into the video.
    - Apply filters: blur, sharpen, grayscale, watermark.
    - **Video compression**

    **Audio Capabilities**
    - Convert between audio formats: .mp3 → .wav, .flac → .aac, etc.
    - Change bitrate, sample rate, or channels.
    - Extract audio from a video file.
    - Normalize or adjust volume.
    - Apply effects: fade in/out, echo, equalizer.
    - Mix multiple audio tracks.

    **Image Capabilities**
    - Convert between image formats: .png → .jpg, .bmp → .tiff, etc.
    - Extract frames from a video.
    - Create a video or GIF from images.
    - Resize, crop, or apply filters.
    - Generate thumbnails.

    **Authentication & Security**
    - **Client Authentication**: All non-public endpoints require X-CLIENT-ID and X-CLIENT-SECRET headers for client verification
    - **User Authentication**: Protected endpoints require JWT Bearer token obtained from /auth/token/token-pairs
    - **Admin Endpoints**: Require API Key authentication in addition to client credentials and bearer token
    - Local requests (localhost/127.0.0.1) bypass client secret validation

    The health endpoints check if the storage bucket and event messaging system are operational.

  version: "1.0.0"
  contact:
    name: Abegà Razafindratelo
    email: a.razafindratelo@gmail.com
    url: https://github.com/Abega1642

servers:
  - url: https://arsmedia.onrender.com
    description: Pre-production server
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: User
    description: User management endpoints
  - name: Video
    description: Video upload, processing, compression, and management endpoints
  - name: Health
    description: Endpoints to verify system and bucket health (public access)
  - name: Docs
    description: API documentation endpoints and redirects

paths:
  /:
    get:
      operationId: rootRedirect
      tags:
        - Docs
      summary: Redirect root path to Swagger UI
      security: [ ]
      responses:
        "302":
          description: Redirects to /doc
          headers:
            Location:
              description: URL to redirect
              schema:
                type: string
                example: /doc

  /ping:
    get:
      operationId: pong
      tags:
        - Health
      summary: Check if the server is alive
      security: [ ]
      responses:
        "200":
          description: Server is alive and responding
          content:
            application/json:
              schema:
                type: string
                example: pong

  /health/bucket:
    get:
      operationId: healthBucketCheck
      tags:
        - Health
      summary: Check bucket health by uploading, downloading, and presigning a file
      description: >
        This endpoint uploads a randomly generated text file to the storage bucket, 
        verifies its content by downloading it, and returns a presigned URL for the file.
      security: [ ]
      responses:
        "200":
          description: Successfully uploaded, verified, and presigned file
          content:
            application/json:
              schema:
                type: string
                example: "https://arsmedia-bucket.s3.amazonaws.com/health/uuid.txt?X-Amz-Signature=..."
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health/message:
    get:
      operationId: triggerDummyEvents
      tags:
        - Health
      summary: Trigger dummy health check events
      description: >
        This endpoint triggers one or more dummy events through the event producer 
        for testing the messaging system (e.g., RabbitMQ or Kafka).
      security: [ ]
      parameters:
        - name: nbEvent
          in: query
          required: false
          description: Number of events to trigger (1–500)
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 500
        - name: waitInSeconds
          in: query
          required: false
          description: Duration (in seconds) to simulate event processing
          schema:
            type: integer
            default: 2
            minimum: 1
      responses:
        "200":
          description: List of UUIDs corresponding to triggered dummy events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "c91f2c9b-9c8e-4e7f-84e2-09c95edff3e4"
                  - "51af4d2b-745a-465d-b9a2-bf0b1c1ffb23"
        "400":
          description: Invalid parameter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "nbEvent must be between 1 and 500"
                path: "/health/message"
                errorCode: "BAD_FORM"

  /health/email:
    get:
      operationId: sendHealthEmail
      tags:
        - Health
      summary: Send health check email
      description: Sends a test email to verify email service functionality
      security: [ ]
      parameters:
        - name: to
          in: query
          required: true
          description: Email address to send the health check email to
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Email sent successfully
          content:
            application/json:
              schema:
                type: string
                example: "Email sent successfully"
        "400":
          description: Invalid email address format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "Invalid email address format"
                path: "/health/email"
                errorCode: "BAD_FORM"

  /sign-up:
    post:
      operationId: signUp
      tags:
        - User
      summary: Register a new user
      description: Creates a new user account with email, password, and phone number. Requires client credentials for non-local requests.
      security:
        - ClientSecret: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreationRequest"
      responses:
        "200":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestValidation"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "409":
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 409
                error: "Conflict"
                message: "User with email 'user@example.com' already exists"
                path: "/sign-up"
                errorCode: "CONSTRAINT_VIOLATION_ON_FIELDS"

  /users:
    get:
      operationId: findUsers
      tags:
        - User
      summary: Get paginated list of users (ADMIN only)
      description: >
        Retrieves a paginated list of all users. 
        **Requires client credentials, ADMIN role, and API Key authentication.**
      security:
        - ClientSecret: [ ]
          ApiKeyAuth: [ ]
          BearerAuth: [ ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Paginated list of users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAdminOrClient"

  /users/{email}:
    get:
      operationId: findUser
      tags:
        - User
      summary: Get user by email
      description: >
        Retrieves a specific user by their email address.
        **Requires client credentials and Bearer token authentication.**
      security:
        - ClientSecret: [ ]
          BearerAuth: [ ]
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: User found and returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "Email format is invalid"
                path: "/users/invalid-email"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: User login
      description: >
        Authenticates a user with email and password. Returns user information.
        Requires client credentials for non-local requests. After login, use /auth/token/token-pairs to get JWT tokens.
      security:
        - ClientSecret: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful - user authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request format or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "Email and password are required"
                path: "/auth/login"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/ForbiddenLoginOrClient"

  /auth/token/token-pairs:
    post:
      operationId: generateTokenPair
      tags:
        - Authentication
      summary: Generate access and refresh token pair
      description: >
        Generates a new pair of access and refresh tokens for authenticated requests.
        Requires client credentials and valid user credentials from login.
      security:
        - ClientSecret: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPairRequest"
      responses:
        "200":
          description: Token pair generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RTokenPair"
        "400":
          description: Invalid request - missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "userId and userEmail are required"
                path: "/auth/token/token-pairs"
                errorCode: "BAD_FORM"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: Token generation conflict - duplicate token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 409
                error: "Conflict"
                message: "Token already exists for this user"
                path: "/auth/token/token-pairs"
                errorCode: "TOKEN_UNIQUENESS_CONFLICT"

  /auth/token/refresh-token-pairs:
    post:
      operationId: refreshTokenPair
      tags:
        - Authentication
      summary: Refresh access token using refresh token
      description: >
        Generates a new access token using a valid refresh token.
        Requires client credentials and valid refresh token.
      security:
        - ClientSecret: [ ]
      parameters:
        - name: refresh_token
          in: query
          required: true
          description: The refresh token to use for generating new tokens
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RTokenPair"
        "400":
          description: Invalid request - refresh token not provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "Refresh token is required"
                path: "/auth/token/refresh-token-pairs"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/InvalidRefreshToken"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"

  /auth/auth-code/{userId}:
    post:
      operationId: sendAuthCode
      tags:
        - Authentication
      summary: Send authentication code to user
      description: >
        Sends an authentication code to the user's email for account activation.
        Requires client credentials for non-local requests.
      security:
        - ClientSecret: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user to send authentication code to
          schema:
            type: string
      responses:
        "200":
          description: Authentication code sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeResponse"
        "400":
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "Invalid user ID format"
                path: "/auth/auth-code/invalid-id"
                errorCode: "BAD_FORM"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /auth/activate-profile/{userId}:
    patch:
      operationId: activateUserProfile
      tags:
        - Authentication
      summary: Activate user profile with authentication code
      description: >
        Activates a user profile by verifying the authentication code sent to their email.
        Requires client credentials for non-local requests.
      security:
        - ClientSecret: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user to activate
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeRequest"
      responses:
        "200":
          description: Profile activated successfully
          content:
            application/json:
              schema:
                type: boolean
        "400":
          description: Invalid authentication code or request format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "Invalid authentication code format or code does not match"
                path: "/auth/activate-profile/123"
                errorCode: "BAD_FORM"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /auth/api-keys/generate:
    post:
      operationId: generateApiKey
      tags:
        - Authentication
      summary: Generate API key
      description: >
        Generates a new API key for programmatic access.
        **Requires client credentials and Bearer token authentication.**
      security:
        - ClientSecret: [ ]
          BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyRequest"
      responses:
        "200":
          description: API key generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "400":
          description: Invalid request - missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "userEmail and reason are required"
                path: "/auth/api-keys/generate"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"

  /api/media/videos/upload:
    post:
      operationId: uploadVideo
      tags:
        - Video
      summary: Upload a video file
      description: >
        Uploads a video file to the storage bucket.
        **Requires client credentials and Bearer token authentication.**
      security:
        - ClientSecret: [ ]
          BearerAuth: [ ]
      parameters:
        - name: userEmail
          in: query
          required: true
          description: Email of the user uploading the video
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Video file to upload
              required:
                - file
      responses:
        "200":
          description: Video uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid request - missing file or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "Video file is required and userEmail must be valid"
                path: "/api/media/videos/upload"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/media/videos/compression-status/{jobId}:
    get:
      operationId: getCompressionStatus
      tags:
        - Video
      summary: Get compression job status by job ID
      description: >
        Retrieves the current status and details of a specific compression job by its unique job ID.
        **Requires client credentials and Bearer token authentication.**
      security:
        - ClientSecret: [ ]
          BearerAuth: [ ]
      parameters:
        - name: jobId
          in: path
          required: true
          description: Unique identifier of the compression job
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Compression job status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressionJobStatusResponse"
        "400":
          description: Invalid request - jobId is blank or missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "jobId parameter is required and cannot be blank"
                path: "/api/media/videos/compression-status/"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "404":
          description: Compression job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 404
                error: "Not Found"
                message: "Compression job with ID 'job-123' not found"
                path: "/api/media/videos/compression-status/job-123"
                errorCode: "ENTITY_NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/media/videos/compression-jobs/{videoId}:
    get:
      operationId: getCompressionJobsByVideoId
      tags:
        - Video
      summary: Get all compression jobs for a video
      description: >
        Retrieves a list of all compression jobs associated with a specific video ID.
        **Requires client credentials and Bearer token authentication.**
      security:
        - ClientSecret: [ ]
          BearerAuth: [ ]
      parameters:
        - name: videoId
          in: path
          required: true
          description: Unique identifier of the video
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: List of compression jobs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompressionJobStatusResponse"
        "400":
          description: Invalid request - videoId is blank or missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "videoId parameter is required and cannot be blank"
                path: "/api/media/videos/compression-jobs/"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "404":
          description: Video not found or no compression jobs found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 404
                error: "Not Found"
                message: "No compression jobs found for video with ID 'video-123'"
                path: "/api/media/videos/compression-jobs/video-123"
                errorCode: "ENTITY_NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/media/videos/compress/{userEmail}:
    post:
      operationId: compressVideo
      tags:
        - Video
      summary: Compress a video
      description: >
        Initiates video compression process and returns job status with tracking information.
        **Requires client credentials and Bearer token authentication.**
      security:
        - ClientSecret: [ ]
          BearerAuth: [ ]
      parameters:
        - name: userEmail
          in: path
          required: true
          description: Email of the user who owns the video
          schema:
            type: string
            format: email
        - name: bucket_key
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: The storage bucket key of the video to compress
      responses:
        "200":
          description: Video compression initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressionJobStatusResponse"
        "400":
          description: Invalid request - missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "bucket_key parameter is required and cannot be empty"
                path: "/api/media/videos/compress/user@example.com"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 404
                error: "Not Found"
                message: "Video with bucket key 'video-123.mp4' not found"
                path: "/api/media/videos/compress/user@example.com"
                errorCode: "ENTITY_NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/media/videos/compressed:
    get:
      operationId: getAllCompressedVideosOfUser
      tags:
        - Video
      summary: Get all compressed videos for a user
      description: >
        Retrieves a list of all compressed videos belonging to a specific user.
        **Requires client credentials and Bearer token authentication.**
      security:
        - ClientSecret: [ ]
          BearerAuth: [ ]
      parameters:
        - name: userEmail
          in: query
          required: true
          description: Email of the user to retrieve compressed videos for
          schema:
            type: string
            format: email
      responses:
        "200":
          description: List of compressed videos retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "400":
          description: Invalid request - missing or invalid userEmail parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2025-11-04T10:30:00Z"
                status: 400
                error: "Bad Request"
                message: "userEmail parameter is required and must be a valid email"
                path: "/api/media/videos/compressed"
                errorCode: "BAD_FORM"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidClientCredentials"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    ClientSecret:
      type: apiKey
      in: header
      name: X-CLIENT-SECRET
      description: >
        Client secret for API access. Must be provided along with X-CLIENT-ID header.
        Local requests (localhost/127.0.0.1) bypass this requirement.
        Contact API administrator to obtain client credentials.

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT token obtained from /auth/token/token-pairs after login.
        Include in Authorization header as: `Bearer <token>`

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        API key obtained from /auth/api-keys/generate.
        Required for admin endpoints like /users.
        Include in X-API-Key header.

  responses:
    Unauthorized:
      description: Authentication required - missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2025-11-04T10:30:00Z"
            status: 401
            error: "Unauthorized"
            message: "Authentication required"
            path: "/api/endpoint"
            errorCode: "MISSING_AUTHORIZATION"

    AuthenticationFailed:
      description: Authentication failed - invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2025-11-04T10:30:00Z"
            status: 401
            error: "Unauthorized"
            message: "Invalid email or password"
            path: "/auth/login"
            errorCode: "AUTHENTICATION_FAILED"

    InvalidRefreshToken:
      description: Invalid or expired refresh token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2025-11-04T10:30:00Z"
            status: 401
            error: "Unauthorized"
            message: "Refresh token is invalid or has expired"
            path: "/auth/token/refresh-token-pairs"
            errorCode: "INVALID_TOKEN"

    InvalidClientCredentials:
      description: Invalid or missing client credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2025-11-04T10:30:00Z"
            status: 403
            error: "Forbidden"
            message: "Invalid or missing client credentials"
            path: "/api/endpoint"
            errorCode: "AUTHORIZATION_DENIED"

    ForbiddenLoginOrClient:
      description: User account is not activated or invalid client credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            userDeactivated:
              value:
                timestamp: "2025-11-04T10:30:00Z"
                status: 403
                error: "Forbidden"
                message: "User account is not activated. Please check your email for activation code"
                path: "/auth/login"
                errorCode: "USER_DEACTIVATED"
            invalidClientCredentials:
              value:
                timestamp: "2025-11-04T10:30:00Z"
                status: 403
                error: "Forbidden"
                message: "Invalid or missing client credentials"
                path: "/auth/login"
                errorCode: "AUTHORIZATION_DENIED"

    ForbiddenAdminOrClient:
      description: Access denied - ADMIN role required, missing API key, or invalid client credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingApiKey:
              value:
                timestamp: "2025-11-04T10:30:00Z"
                status: 403
                error: "Forbidden"
                message: "Valid API key is required for this endpoint"
                path: "/users"
                errorCode: "AUTHORIZATION_DENIED"
            insufficientRole:
              value:
                timestamp: "2025-11-04T10:30:00Z"
                status: 403
                error: "Forbidden"
                message: "Access denied - ADMIN role required"
                path: "/users"
                errorCode: "AUTHORIZATION_DENIED"
            invalidClientCredentials:
              value:
                timestamp: "2025-11-04T10:30:00Z"
                status: 403
                error: "Forbidden"
                message: "Invalid or missing client credentials"
                path: "/users"
                errorCode: "AUTHORIZATION_DENIED"

    UserNotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2025-11-04T10:30:00Z"
            status: 404
            error: "Not Found"
            message: "User not found"
            path: "/api/endpoint"
            errorCode: "ENTITY_NOT_FOUND"

    BadRequestValidation:
      description: Invalid request data or validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2025-11-04T10:30:00Z"
            status: 400
            error: "Bad Request"
            message: "Email format is invalid or password does not meet requirements"
            path: "/sign-up"
            errorCode: "CONSTRAINT_VIOLATION_ON_FIELDS"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2025-11-04T10:30:00Z"
            status: 500
            error: "Internal Server Error"
            message: "An unexpected error occurred"
            path: "/api/endpoint"
            errorCode: "INTERNAL_SERVER_ERROR"

  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: HTTP status reason phrase
          example: "Bad Request"
        message:
          type: string
          description: Detailed error message
          example: "Validation failed"
        path:
          type: string
          description: Request path where error occurred
          example: "/path/of/the/endpoint"
        errorCode:
          type: string
          description: Application-specific error code
          enum:
            - AUTHORIZATION_DENIED
            - ENTITY_NOT_FOUND
            - CONSTRAINT_VIOLATION_ON_FIELDS
            - TOKEN_UNIQUENESS_CONFLICT
            - BAD_FORM
            - MISSING_AUTHORIZATION
            - INVALID_AUTHORIZATION_FORMAT
            - INVALID_TOKEN
            - TOKEN_NOT_FOUND
            - USER_DEACTIVATED
            - AUTHENTICATION_FAILED
            - INTERNAL_SERVER_ERROR
            - MISSING_REQUIRED_PARAMETER
            - INVALID_PARAMETER
            - MALFORMED_JSON
            - METHOD_NOT_ALLOWED
      required:
        - timestamp
        - status
        - error
        - message
        - path

    CompressionJobStatusResponse:
      type: object
      properties:
        jobId:
          type: string
          description: Unique identifier for the compression job
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - COMPLETED
            - FAILED
            - CANCELLED
          description: Current status of the compression job
        createdAt:
          type: string
          format: date-time
          description: When the compression job was created
        completedAt:
          type: string
          format: date-time
          description: When the compression job was completed (if finished)
        compressedVideoId:
          type: string
          description: ID of the compressed video (when compression is successful)
        compressedVideoUrl:
          type: string
          description: URL to access the compressed video (when compression is successful)
        errorMessage:
          type: string
          description: Error message if compression failed
        attemptCount:
          type: integer
          format: int32
          description: Number of compression attempts made
      required:
        - jobId
        - status
        - createdAt
        - attemptCount

    UserCreationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address (must be unique)
        phoneNumber:
          type: string
          minLength: 1
          description: User's phone number
        pseudo:
          type: string
          description: User's display name (optional)
        role:
          type: string
          enum:
            - ADMIN
            - USER
          description: User's role in the system
        password:
          type: string
          minLength: 1
          format: password
          description: User's password
      required:
        - email
        - password
        - phoneNumber
        - role

    GrantedAuthority:
      type: object
      properties:
        authority:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        pseudo:
          type: string
        phoneNumber:
          type: string
        imageProfileBucketKey:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - USER
        password:
          type: string
          format: password
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        username:
          type: string
        authorities:
          type: array
          items:
            $ref: "#/components/schemas/GrantedAuthority"
        activated:
          type: boolean
        enabled:
          type: boolean
        accountNonExpired:
          type: boolean
        accountNonLocked:
          type: boolean
        credentialsNonExpired:
          type: boolean

    TokenPairRequest:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
          description: ID of the user requesting tokens
        userEmail:
          type: string
          format: email
          minLength: 1
          description: Email of the user requesting tokens
      required:
        - userEmail
        - userId

    RToken:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        creation:
          type: string
          format: date-time
        expiration:
          type: string
          format: date-time
        isValid:
          type: boolean
        value:
          type: string
          description: The actual token string

    RTokenPair:
      type: object
      properties:
        accessToken:
          $ref: "#/components/schemas/RToken"
        refreshToken:
          $ref: "#/components/schemas/RToken"
        requestTime:
          type: string
          format: date-time
      required:
        - accessToken
        - refreshToken
        - requestTime

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address
        password:
          type: string
          minLength: 1
          format: password
          description: User's password
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          description: Login status message
        email:
          type: string
          format: email
        requestTime:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/RUser"

    RUser:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        pseudo:
          type: string
          minLength: 1
        imageProfileBucketKey:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - ADMIN
            - USER
      required:
        - email
        - id
        - imageProfileBucketKey
        - phoneNumber
        - pseudo
        - role

    AuthCodeResponse:
      type: object
      properties:
        sentTo:
          type: string
          format: email
          minLength: 1
          description: Email address where the code was sent
        sentAt:
          type: string
          format: date-time
          description: Timestamp when the code was sent
      required:
        - sentTo

    ApiKeyRequest:
      type: object
      properties:
        userEmail:
          type: string
          format: email
          minLength: 1
          description: Email of the user requesting the API key
        reason:
          type: string
          description: Reason for generating the API key
      required:
        - reason
        - userEmail

    ApiKeyResponse:
      type: object
      properties:
        apiKeyValue:
          type: string
          description: The generated API key value
        createdAt:
          type: string
          format: date-time
          description: When the API key was created

    AuthCodeRequest:
      type: object
      properties:
        userEmail:
          type: string
          format: email
          minLength: 1
          description: Email of the user
        code:
          type: string
          minLength: 1
          description: Authentication code received via email
      required:
        - code
        - userEmail

    Video:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        size:
          type: number
          format: double
        sizeType:
          type: string
          enum:
            - BYTES
            - KB
            - MB
            - GB
            - TB
            - PB
            - EB
        fileType:
          type: string
          enum:
            - VIDEO
            - IMAGE
            - AUDIO
        createdAt:
          type: string
          format: date-time
        filePath:
          type: string
          description: Path to the file in storage
        owner:
          $ref: "#/components/schemas/User"
        duration:
          type: number
          format: double
          description: Video duration in seconds
        codec:
          type: string
          enum:
            - H264
            - H265
            - MPEG1
            - MPEG2
            - MPEG4
            - VP8
            - VP9
            - AV1
            - THEORA
            - WMV1
            - WMV2
            - WMV3
            - MJPEG
            - PRORES
            - DNXHD
            - CINEFORM
            - DV
            - XVID
            - DIVX
            - HEVC
            - UNKNOWN
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        frameRate:
          type: number
          format: double
        aspectRatio:
          type: string
        containerFormat:
          type: string
          enum:
            - MP4
            - MKV
            - MOV
            - AVI
            - FLV
            - WMV
            - WEBM
            - MPEG_TS
            - MPEG_PS
            - THREEGP
            - OGG
            - M4A
            - WAV
            - FLAC
            - ASF
            - APE
            - AIFF
            - UNKNOWN
        bitRate:
          type: number
          format: double
        audioCodec:
          type: string
          enum:
            - NONE
            - AAC
            - MP3
            - MP2
            - AC3
            - EAC3
            - DTS
            - PCM
            - PCM_S16LE
            - PCM_S24LE
            - FLAC
            - OPUS
            - VORBIS
            - WMA
            - ALAC
            - AMR_NB
            - AMR_WB
            - G711
            - G722
            - UNKNOWN
        audioChannels:
          type: integer
          format: int32
        audioSampleRate:
          type: integer
          format: int32

    ProcessSuccessResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
        path:
          type: string
          description: Path or URL to the processed file

    PageUser:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/User"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean

    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean

    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean

security:
  - BearerAuth: [ ]