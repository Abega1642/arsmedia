name: CI - Qodana

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  qodana:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.2
        with:
          linter: jetbrains/qodana-jvm-community:2025.2
          use-docker: true
          args: >
            --cache-dir /home/runner/work/_temp/qodana/caches
            --results-dir /home/runner/work/_temp/qodana/results
            --skip-pull
            --save-report

      - name: Debug – list Qodana results directory
        if: always()
        run: |
          echo "===== DEBUG: Listing ${{ runner.temp }}/qodana ====="
          ls -R "${{ runner.temp }}/qodana" || echo "Directory not found"

      - name: Print Qodana Summary
        if: always()
        run: |
          echo "===== QODANA SUMMARY ====="
          jq '.' "${{ runner.temp }}/qodana/results/summary.json" \
            || echo "No summary.json found"

      - name: Print Qodana Raw Problems
        if: always()
        run: |
          echo "===== QODANA PROBLEMS ====="
          jq '.problems[] | {
                rule: .problemType,
                message: .details,
                file: .file,
                line: .line,
                severity: .severity
              }' \
            "${{ runner.temp }}/qodana/results/qodana.json" \
            || echo "No qodana.json found"

      - name: Print Qodana SARIF issues (compact)
        if: always()
        run: |
          echo "===== QODANA SARIF ====="
          jq '.runs[].results[] | {
                ruleId,
                message: .message.text,
                file: .locations[0].physicalLocation.artifactLocation.uri,
                line: .locations[0].physicalLocation.region.startLine
              }' \
            "${{ runner.temp }}/qodana/results/qodana.sarif.json" \
            || echo "No SARIF found"
