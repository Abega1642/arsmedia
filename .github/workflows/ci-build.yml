name: CI - Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from template
        run: |
          cp .env.template .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: arsmedia-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image was created
        run: |
          docker images | grep arsmedia-app
          echo "Docker build successful!"

      - name: Verify JAR file exists in image
        run: |
          docker run --rm arsmedia-app:${{ github.sha }} ls -lh /app/app.jar
          echo "Application JAR found in image!"

      - name: Verify Java version in image
        run: |
          docker run --rm arsmedia-app:${{ github.sha }} java -version