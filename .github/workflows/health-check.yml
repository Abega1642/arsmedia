name: CD - Health check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # -------------------------------
      # Step 1: Warm up Render service
      # -------------------------------
      - name: Warm up service (Render cold start)
        shell: bash
        run: |
          echo "Warming up service..."
          curl -s https://arsmedia.onrender.com/ping || true
          echo "Waiting for service to boot..."
          sleep 40

      # --------------------------------
      # Step 2: Health check with retries
      # --------------------------------
      - name: Health check with retries
        shell: bash
        run: |
          URL="https://arsmedia.onrender.com/ping"

          MAX_RETRIES=5
          RETRY_DELAY=45
          ATTEMPT=1
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "Attempt $ATTEMPT of $MAX_RETRIES"

            HTTP_STATUS=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 120 "$URL")
            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Service is healthy."
              SUCCESS=true
              break
            fi

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "Waiting $RETRY_DELAY seconds before retry..."
              sleep $RETRY_DELAY
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" = false ]; then
            echo "Health check failed after retries"
            echo "FAILED_URL=$URL" >> "$GITHUB_ENV"
            echo "FAILED_STATUS=$HTTP_STATUS" >> "$GITHUB_ENV"
            exit 1
          fi

      # --------------------------------
      # Step 3: Create issue on failure
      # --------------------------------
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Health Check Failed - ${new Date().toISOString()}`,
              body: `
## Health Check Failure Report

**Time:** ${new Date().toLocaleString()}
**Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

**URL:** https://arsmedia.onrender.com/ping  
**Last Status:** ${process.env.FAILED_STATUS}

### Notes
- Render free-tier services may return 503 during cold starts.
- Health check retried with warm-up and delay before failing.
`,
              labels: ['health-check', 'monitoring']
            });
