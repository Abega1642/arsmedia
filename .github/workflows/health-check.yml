name: CD - Health check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # -----------------------------
      # Warm up Render (best effort)
      # -----------------------------
      - name: Warm up service
        shell: bash
        run: |
          echo "Warming up Render service..."
          curl -s --max-time 10 https://arsmedia.onrender.com/ping || true
          sleep 10

      # -----------------------------
      # Health check with retries
      # -----------------------------
      - name: Health check
        id: health_check
        shell: bash
        run: |
          set -euo pipefail

          URL="https://arsmedia.onrender.com/ping"
          MAX_RETRIES=5
          SLEEP_SECONDS=40

          ATTEMPT=1
          HTTP_STATUS="000"

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "Attempt $ATTEMPT of $MAX_RETRIES"
            HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo "000")
            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Service healthy."
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "Waiting $SLEEP_SECONDS seconds..."
              sleep $SLEEP_SECONDS
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "FAILED_URL=$URL" >> "$GITHUB_ENV"
          echo "FAILED_STATUS=$HTTP_STATUS" >> "$GITHUB_ENV"
          exit 1

      # -----------------------------
      # Create issue on failure
      # -----------------------------
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Health Check Failed - ${new Date().toISOString()}`,
              body: `
## Health Check Failure

**URL:** https://arsmedia.onrender.com/ping  
**Status:** ${process.env.FAILED_STATUS}

Likely causes:
- Render free-tier cold start
- Service restarting
- App not listening on correct port

See workflow logs for details.
`,
              labels: ['health-check', 'monitoring']
            });
