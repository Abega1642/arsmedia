name: CD - Health check

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-url:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Check URL Status
        run: |
          URL="https://arsmedia.onrender.com/ping"
          
          echo "Checking $URL..."
          
          HTTP_STATUS=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 30 "$URL")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ping Success! URL returned status 200"
            exit 0
          else
            echo "Ping Failed! URL returned status $HTTP_STATUS instead of 200"
            exit 1
          fi

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Health Check Failed - ' + new Date().toISOString(),
              body: `## Health Check Failure Report
            
              **URL:** https://arsmedia.onrender.com/ping
              **Time:** ${new Date().toLocaleString()}
              **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            
              The health check failed. The URL did not return a 200 status code.
            
              ### Possible Causes:
              - Service is down
              - Service is restarting (Render free tier spin-up)
              - Network issues
              - Server error
            
              Please investigate and resolve the issue.`,
              labels: ['bug', 'health-check']
            });
            console.log('Created issue:', issue.data.number);