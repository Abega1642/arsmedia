plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    group = 'dev.razafindratelo.arsmedia'
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '--enable-preview'
}

tasks.withType(Test).configureEach {
    jvmArgs += '--enable-preview'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    implementation 'net.bramp.ffmpeg:ffmpeg:0.8.0'

    implementation 'com.resend:resend-java:4.6.0'
    implementation 'org.apache.tika:tika-core:3.2.3'

    implementation 'software.amazon.awssdk:s3:2.21.40'
    implementation 'software.amazon.awssdk:s3-transfer-manager:2.21.40'

    implementation 'com.github.kokorin.jaffree:jaffree:2024.08.29'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:localstack:1.21.3'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.icegreen:greenmail:2.0.1'
    testImplementation 'com.icegreen:greenmail-junit5:2.0.1'
}

test {
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    useJUnitPlatform()
    finalizedBy jacocoTestCoverageVerification

    jvmArgs(
            '-XX:+EnableDynamicAgentLoading',
            '-Djdk.instrument.traceUsage=false',
            '-Xshare:off'
    )

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true

        info {
            events "failed", "skipped"
            exceptionFormat "full"
        }

        debug {
            events "started", "failed"
            exceptionFormat "full"
        }
    }

    failFast = true

    afterTest { descriptor, result ->
        if (result.resultType == TestResult.ResultType.FAILURE) {
            logger.lifecycle("\tTEST FAILED: ${descriptor.className}.${descriptor.name}")
            logger.lifecycle("\tDuration: ${result.endTime - result.startTime}ms")
        }
    }

    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\nTEST SUMMARY:"
            println "\tResults: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
            println "\tTime: ${(result.endTime - result.startTime) / 1000} seconds"

            if (result.failedTestCount > 0) {
                println "\nFAILED TESTS:"
                result.testResults.findAll { it.resultType == TestResult.ResultType.FAILURE }.each { testResult ->
                    println "\t- ${testResult.className}.${testResult.name}"
                    if (testResult.exception) {
                        println "\t\tReason: ${testResult.exception.message}"
                    }
                }
            }
        }
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/gen/**"
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                counter = "LINE"
                minimum = 0.5
            }
        }
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/gen/**"
            ])
        }))
    }
    doLast {
        def coverageReportFile = layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml").get().asFile
        if (!coverageReportFile.exists()) {
            println "No JaCoCo coverage report found at: ${coverageReportFile.absolutePath}"
            return
        }

        def xmlText = coverageReportFile.text
        println "\nJACOCO COVERAGE REPORT"
        println "=" * 50

        def lineMatcher = xmlText =~ /<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/
        if (lineMatcher.find()) {
            def missed = lineMatcher.group(1).toInteger()
            def covered = lineMatcher.group(2).toInteger()
            def total = missed + covered
            def rate = total > 0 ? (covered / total) * 100 : 0
            println "Line Coverage: ${rate.round(2)}% (${covered}/${total} lines)"
        }

        def branchMatcher = xmlText =~ /<counter type="BRANCH" missed="(\d+)" covered="(\d+)"\/>/
        if (branchMatcher.find()) {
            def missed = branchMatcher.group(1).toInteger()
            def covered = branchMatcher.group(2).toInteger()
            def total = missed + covered
            def rate = total > 0 ? (covered / total) * 100 : 0
            println "Branch Coverage: ${rate.round(2)}% (${covered}/${total} branches)"
        }

        def methodMatcher = xmlText =~ /<counter type="METHOD" missed="(\d+)" covered="(\d+)"\/>/
        if (methodMatcher.find()) {
            def missed = methodMatcher.group(1).toInteger()
            def covered = methodMatcher.group(2).toInteger()
            def total = missed + covered
            def rate = total > 0 ? (covered / total) * 100 : 0
            println "Method Coverage: ${rate.round(2)}% (${covered}/${total} methods)"
        }

        def classMatcher = xmlText =~ /<counter type="CLASS" missed="(\d+)" covered="(\d+)"\/>/
        if (classMatcher.find()) {
            def missed = classMatcher.group(1).toInteger()
            def covered = classMatcher.group(2).toInteger()
            def total = missed + covered
            def rate = total > 0 ? (covered / total) * 100 : 0
            println "Class Coverage: ${rate.round(2)}% (${covered}/${total} classes)"
        }

        println "=" * 50
        println "Detailed HTML report: ${layout.buildDirectory.file('reports/jacoco/test/html/index.html').get().asFile.absolutePath}"

        def lineCoverageMatcher = xmlText =~ /<counter type="LINE" missed="(\d+)" covered="(\d+)"\/>/
        if (lineCoverageMatcher.find()) {
            def missed = lineCoverageMatcher.group(1).toInteger()
            def covered = lineCoverageMatcher.group(2).toInteger()
            def total = missed + covered
            def rate = total > 0 ? (covered / total) * 100 : 0

            if (rate < 50) {
                println "WARNING: Line coverage (${rate.round(2)}%) is below 50% minimum!"
            } else {
                println "Line coverage meets minimum requirement of 50%"
            }
        }
    }
}

tasks.register('testWithCoverage') {
    group = 'verification'
    description = 'Run tests with detailed reporting and coverage'
    dependsOn test, jacocoTestReport
}

test.finalizedBy jacocoTestReport